<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website đầu tiên</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #2196F3;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }
    </style>
</head>
<body>

<header>
    <h1>🌐 Chào mừng đến với Website của tôi</h1>
</header>

<main>
    <h2>Xin chào!</h2>
    <p>Đây là một website đơn giản được tạo bằng HTML, CSS và JavaScript.</p>

    <button onclick="hello()">Bấm vào đây</button>
</main>

<script>
function hello() {
    alert("Xin chào! Cảm ơn bạn đã ghé thăm website.");
}
</script>

</body>
</html>
